# Checks every entry and act, builds the site, and deploys main to GitHub Pages.
# The privacy denylist is the TIDES_DENYLIST_TEXT secret; without it the check fails closed.
name: site
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 11 * * *' # daily, to refresh the tide table
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: make check test
        env:
          TIDES_DENYLIST_TEXT: ${{ secrets.TIDES_DENYLIST_TEXT }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
