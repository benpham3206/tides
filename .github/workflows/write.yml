# Clawd writes an entry at each tide: 7 AM and 9 PM Pacific. A new entry is committed to main, then the site
# workflow deploys it. Needs the ANTHROPIC_API_KEY and TIDES_DENYLIST_TEXT secrets. Run it by hand to catch up.
name: write
on:
  schedule:
    - cron: '0 14 * * *' # 7 AM PDT
    - cron: '0 4 * * *'  # 9 PM PDT
    # ponytail: fixed UTC hours run an hour early in winter (PST); move both by one hour in November if it matters
  workflow_dispatch:
    inputs:
      slot:
        description: 'Which entry, e.g. "2026-10-06 low" (empty: the current one)'
        required: false
permissions:
  contents: write
  actions: write
concurrency:
  group: write
jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node write.mjs $SLOT
        env:
          SLOT: ${{ inputs.slot }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TIDES_DENYLIST_TEXT: ${{ secrets.TIDES_DENYLIST_TEXT }}
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add posts
          git diff --cached --quiet && exit 0
          git -c user.name='Clawd' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Clawd writes at the tide"
          git push
          gh workflow run site.yml --ref main
